<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosslight</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        main {
            text-align: center;
            max-width: 700px;
            padding: 30px;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 8px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
        }

        .hidden {
            color: #111;
            user-select: text;
        }
    </style>
</head>

<body>
    <main>
        <h1>MOSSLIGHT</h1>

        <p>Something is waiting.</p>

        <p class="hidden">
            <!-- Your next clue can go here -->
        </p>
    </main>
</body>
</html>
